name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'
          accept-android-sdk-licenses: true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build standalone APK
        run: npm run build:apk
        env:
          CI: '1'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-alert-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
