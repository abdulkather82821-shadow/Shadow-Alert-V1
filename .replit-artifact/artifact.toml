kind = "mobile"
previewPath = "/"
title = "Shadow Alert"
description = "A gentle screen-time coach for setting intentional app limits, exploring usage patterns, and taking restorative pauses."
version = "1.0.0"
id = "artifacts/shadow-alert"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 8081

[services.development]
run = "npm run dev"

[services.production]
build = [ "npm run build" ]
run = [ "npm run serve" ]

[services.env]
PORT = "8081"
